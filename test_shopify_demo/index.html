<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopify Section Builder Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="panel" id="panel">
      <h2>🛠 Section Settings</h2>
      <div id="settings-form"></div>
      <p class="hint">Changes apply live →</p>
    </aside>
    <main class="preview" id="preview">
      <section data-section="announcement" class="section"></section>
      <section data-section="features" class="section"></section>
      <section data-section="testimonials" class="section"></section>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
