[project]
name = "pennypinch"
version = "0.1.0"
description = "A CLI personal finance tracker backed by a local JSON file."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pennypinch = "pennypinch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pennypinch"]